spring:
  application:
    name: scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${DB_USERNAME:scheduler}
    password: ${DB_PASSWORD:scheduler}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

server:
  # Behind nginx the TCP peer is the proxy, so getRemoteAddr() would be the same for every client and the
  # login lock-out (keyed by username + IP) would lock everyone out. "native" makes Tomcat's RemoteIpValve
  # read X-Forwarded-For, trusting only private-network proxies (the Docker network), so clients cannot spoof it.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: ${APP_TIMEZONE:America/Bogota}
  admin:
    reset-enabled: ${ADMIN_RESET_ENABLED:false}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:1h}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
    user-username: ${APP_USER_USERNAME:user}
    user-password: ${APP_USER_PASSWORD:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    max-login-attempts: 5
    # How long a username + IP stays locked, and also how long a failed attempt counts towards the limit.
    login-lock-duration: 5m
