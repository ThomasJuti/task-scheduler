spring:
  application:
    name: scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${DB_USERNAME:scheduler}
    password: ${DB_PASSWORD:scheduler}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

server:
  # Detrás de nginx el par TCP es el proxy, así que getRemoteAddr() sería igual para todos los clientes y el
  # bloqueo de login (por usuario + IP) bloquearía a todos. "native" hace que el RemoteIpValve de Tomcat lea
  # X-Forwarded-For, confiando solo en proxies de red privada (la red de Docker), así los clientes no pueden falsificarlo.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: ${APP_TIMEZONE:America/Bogota}
  admin:
    reset-enabled: ${ADMIN_RESET_ENABLED:false}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:1h}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
    user-username: ${APP_USER_USERNAME:user}
    user-password: ${APP_USER_PASSWORD:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    max-login-attempts: 5
    # Cuánto tiempo queda bloqueado un usuario + IP, y también cuánto cuenta un intento fallido para el límite.
    login-lock-duration: 5m
